<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>운동 인증 분석기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5">
  <h2 class="mb-4">📊 카카오톡 운동 인증 분석기</h2>

  <form action="/run" method="post" enctype="multipart/form-data" class="bg-white border rounded p-4 mb-4">
    <div class="mb-3">
      <label for="outCount" class="form-label">✅ 기준 인증 횟수 (OUT_COUNT)</label>
      <input type="number" class="form-control" id="outCount" name="outCount" value="4" required>
    </div>
    <div class="mb-3">
      <label for="money" class="form-label">💰 1회당 벌금 (MONEY, 원)</label>
      <input type="number" class="form-control" id="money" name="money" value="5000" required>
    </div>
    <div class="mb-3">
      <label for="chatFile" class="form-label">📁 카카오톡 채팅 파일 업로드 (.txt)</label>
      <input type="file" class="form-control" id="chatFile" name="chatFile" accept=".txt" required>
    </div>
    <button type="submit" class="btn btn-primary">🚀 분석 시작</button>
  </form>

  {% if table %}
    <div class="card p-3 border shadow-sm">
      <h5 class="mb-3">📈 분석 결과</h5>
      {{ table|safe }}
    </div>
  {% endif %}
</div>
</body>
</html>
